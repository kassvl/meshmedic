entry: no-route-blackhole
summary: >
  The VirtualService route is narrowed to a path nothing calls, so requests
  match no route and the proxy stamps NR. Live validation of this class found
  what the specification does not say: a no-route request never resolves a
  destination, so it is attributed to the source, which is why this entry keys
  on the caller's namespace while every other one keys on the destination.
target:
  service: payments
  namespace: demo
  workload: payments-v2
  subset: v2
  stable_subset: v1
inject:
  - desc: narrow the route so live traffic matches nothing
    run: [kubectl, --context=kind-meshmedic-demo, -n, demo, patch, virtualservice, payments, --type=merge, -p, '{"spec":{"http":[{"match":[{"uri":{"prefix":"/a-path-nothing-calls"}}],"route":[{"destination":{"host":"payments","subset":"v1"},"weight":80},{"destination":{"host":"payments","subset":"v2"},"weight":20}]}]}}']
reset:
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, patch, virtualservice, payments, --type=merge, -p, '{"spec":{"http":[{"route":[{"destination":{"host":"payments","subset":"v1"},"weight":80},{"destination":{"host":"payments","subset":"v2"},"weight":20}]}]}}']
settle: 90s
firesWithin: 6m
resolvesWithin: 6m
expect:
  # Source-keyed, so the report must name the black-holed caller rather than
  # the destination it failed to reach.
  names:
    - loadgen
  # Nothing reaches payments any more, so its telemetry stops. That is the
  # same fault seen from the other side, not a cascade to suppress.
  allowFiring:
    - traffic-vanished-triage
