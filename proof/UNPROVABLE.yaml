# Entries that cannot be proven on this testbed, and why.
#
# Boundry's principle, borrowed: every enforcement gap must be visible rather
# than hidden by omission. An entry with no proof file is ambiguous — nobody
# can tell "we have not got to it" from "it cannot be done". This file makes
# the second kind explicit, so the inventory reads N proven, M declared
# unprovable with a reason, and zero silently missing.
#
# A declaration here is not an excuse. Each one names what would have to change
# for the entry to become provable, which is the difference between a limit and
# a shrug.

unprovable:
  - entry: retry-storm-damping
    reason: >
      Measured on 2026-08-19: envoy_cluster_upstream_rq_retry exists on this
      cluster with exactly five series, every one of them
      cluster_name="xds-grpc", which is a proxy's own connection to istiod.
      There is no application-cluster retry counter for the signal to read, so
      no injected fault can make this entry fire here. The metric name existing
      is why a name-level check called it healthy; only a target-scoped series
      probe sees the truth.
    would_become_provable_if: >
      The waypoint exposed per-application-cluster retry counters, or the
      testbed moved the entry's signal onto a retry metric Istio does surface.
      Until then this is a property of the testbed, not of the entry.

  - entry: waypoint-overload-scale
    reason: >
      The signal is namespace request rate divided by ready waypoint pods,
      firing above 1000. Measured on the live testbed at 12.46 with one
      waypoint pod, so reaching the threshold needs roughly eighty times the
      current traffic. A single-node kind cluster cannot produce that load
      without the load generator itself becoming the bottleneck, which would
      make the measurement about the generator rather than the waypoint.
    would_become_provable_if: >
      The entry gained a baselineMultiplier so it fired on deviation from this
      cluster's own normal instead of a fixed number, which is the same remedy
      the calibration gate recommends for every threshold that is right for one
      cluster and wrong for the rest. That is a catalog change, and it needs its
      own validation.

  - entry: mtls-policy-conflict
    reason: >
      Measured on 2026-08-19, and the finding is larger than a testbed limit.
      STRICT mTLS was applied to the sidecar-mode namespace with an unenrolled
      plaintext caller. The caller was genuinely rejected (curl exit 56, the
      connection reset) and the mesh recorded nothing at all: no
      istio_requests_total with the 503 and UF/URX this entry's signal reads,
      and no istio_tcp_connections_closed_total either, while the in-mesh
      loadgen kept reporting 200s at 7.7 rps from the same namespace. A sidecar
      drops the connection at the TLS layer before any metric exists to stamp.
      Cross-checked against every recorded run in this repository and the
      benchmark: the only entry that has ever fired for this class is
      mtls-policy-conflict-ambient. This one has never fired anywhere.
    would_become_provable_if: >
      Nothing about the testbed would fix it, which is why this needs a
      decision rather than more work. The entry looks for a signal a sidecar
      does not emit, so it is probably dead by construction on any sidecar
      mesh, and the honest options are to rework its signal onto telemetry that
      exists or to retire it. Either is a catalog change and needs its own
      review. The measurement also strengthens F1: ambient's ztunnel records
      this denial at L4 and a sidecar records nothing, which is a contrast the
      claim previously asserted and can now cite.
