entry: fault-injection-left-in-production
summary: >
  A fault-injection abort left enabled at 50 percent, the shape of a test knob
  that survived a merge. Distinct from a genuine 5xx surge because the proxy
  stamps FI, and the fix is to remove a stanza rather than to eject endpoints.
target:
  service: payments
  namespace: demo
  workload: payments-v2
  subset: v2
  stable_subset: v1
inject:
  - desc: leave a fault-injection abort in the VirtualService
    run: [kubectl, --context=kind-meshmedic-demo, -n, demo, patch, virtualservice, payments, --type=merge, -p, '{"spec":{"http":[{"fault":{"abort":{"percentage":{"value":50},"httpStatus":503}},"route":[{"destination":{"host":"payments","subset":"v1"},"weight":80},{"destination":{"host":"payments","subset":"v2"},"weight":20}]}]}}']
reset:
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, patch, virtualservice, payments, --type=merge, -p, '{"spec":{"http":[{"route":[{"destination":{"host":"payments","subset":"v1"},"weight":80},{"destination":{"host":"payments","subset":"v2"},"weight":20}]}]}}']
settle: 90s
firesWithin: 6m
resolvesWithin: 6m
expect:
  names:
    - payments
  quiet:
    - error-surge-outlier-ejection
