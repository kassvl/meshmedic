entry: error-surge-outlier-ejection
summary: >
  The canary subset returns 500 for 90 percent of requests. This is the honest
  representative of its class: a bad deploy serving errors from a subset of
  endpoints, which is what outlier ejection exists to contain.
target:
  service: payments
  namespace: demo
  workload: payments-v2
  subset: v2
  stable_subset: v1
inject:
  - desc: make the v2 canary serve 500s
    run: [kubectl, --context=kind-meshmedic-demo, -n, demo, set, env, deploy/payments-v2, ERROR_RATE=0.9, ERROR_CODE=500]
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, rollout, status, deploy/payments-v2, --timeout=180s]
reset:
  - desc: restore the canary
    run: [kubectl, --context=kind-meshmedic-demo, -n, demo, set, env, deploy/payments-v2, ERROR_RATE=0, ERROR_CODE-]
  - run: [kubectl, --context=kind-meshmedic-demo, -n, demo, rollout, status, deploy/payments-v2, --timeout=180s]
settle: 90s
firesWithin: 5m
resolvesWithin: 5m
# The fix is proven with the fault untouched. ERROR_RATE stays at 0.9 on the
# canary; the patch turns on outlier detection, and the claim is that ejecting
# the failing endpoints drops the service's 5xx ratio even though the endpoints
# are still broken. Removing the fault first would prove only that the fault
# caused it, which the resolution half above already shows.
remediation:
  clearsWithin: 4m
  revert:
    - desc: remove the outlier detection the patch added
      run: [kubectl, --context=kind-meshmedic-demo, -n, demo, delete, destinationrule, payments-outlier, --ignore-not-found]
expect:
  # The entry must name the failing subset, not just report a ratio. A 5xx
  # surge that does not say which workload is emitting them tells an operator
  # nothing they could not read off a dashboard.
  names:
    - payments-v2
