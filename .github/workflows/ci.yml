name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/meshmedic validate
      # The lock is the difference between accepted and merely committed:
      # an approved entry that was edited without re-approval must not reach
      # main pretending to be reviewed.
      - run: go run ./cmd/meshmedic validate --no-drift
